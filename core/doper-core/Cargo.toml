[package]
name = "doper-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
doper-abi = { path = "../doper-abi" }
doper-layout = { path = "../doper-layout" }
doper-paint = { path = "../doper-paint" }
doper-scene = { path = "../doper-scene" }
doper-scroll = { path = "../doper-scroll" }

[dev-dependencies]
doper-edit = { path = "../doper-edit" }
doper-headless = { path = "../doper-headless" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
