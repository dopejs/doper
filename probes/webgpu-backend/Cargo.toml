# Isolated prototype workspace: heavyweight GPU dependencies must not slow
# the product gates. Built only by the M5 backend-differential script.
[workspace]

[package]
name = "pingo-gpu-probe"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
pingo-abi = { path = "../../core/pingo-abi" }
pingo-headless = { path = "../../core/pingo-headless" }
pingo-paint = { path = "../../core/pingo-paint" }
pingo-scene = { path = "../../core/pingo-scene" }
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.1"
wgpu = "=30.0.0"

[lints.clippy]
all = "deny"
pedantic = "deny"
