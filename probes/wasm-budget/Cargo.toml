[package]
name = "pingo-probe-wasm-budget"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fontdue = { version = "=0.9.4", default-features = false, features = ["std"] }
swash = { version = "=0.2.10", default-features = false, features = ["libm"] }
unicode-segmentation = "=1.13.3"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"
