[workspace]
resolver = "2"
members = [
  "core/doper-abi",
  "core/doper-core",
  "core/doper-edit",
  "core/doper-headless",
  "core/doper-hit",
  "core/doper-layout",
  "core/doper-paint",
  "core/doper-scene",
  "core/doper-scroll",
  "core/doper-text",
  "probes/wasm-budget",
  "probes/wasm-cold-start",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/dopejs/doper"
rust-version = "1.96"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"

# Test/debug artifacts otherwise dominate local disk usage. Line tables retain
# actionable backtraces while disabling the large incremental object cache.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
