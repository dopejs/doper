[workspace]
resolver = "2"
members = ["probes/wasm-budget", "probes/wasm-cold-start"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/dopejs/doper"
rust-version = "1.96"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
